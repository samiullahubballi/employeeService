name: Build and Multi-Env Deployment Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Validate Kubernetes Manifests
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: '0.6.7'

      - name: Run Kubeconform Validation
        run: kubeconform -summary -strict k8s/

  deploy-to-dev:
    needs: build-and-validate
    runs-on: self-hosted
    environment: DEV
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image locally
        run: docker build -t employee-service:latest .

      - name: Create or Update DB Secret in K8s (DEV)
        env:
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: kubectl create secret generic db-credentials --from-literal=username="$env:DB_USER" --from-literal=password="$env:DB_PASS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to DEV Environment
        run: |
          kubectl apply -f k8s/deployment-dev.yaml
          kubectl rollout restart deployment/employee-service-dev

  deploy-to-qa:
    needs: deploy-to-dev
    runs-on: self-hosted
    environment: QA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create or Update DB Secret in K8s (QA)
        env:
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: kubectl create secret generic db-credentials --from-literal=username="$env:DB_USER" --from-literal=password="$env:DB_PASS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to QA Environment
        run: |
          kubectl apply -f k8s/deployment-qa.yaml
          kubectl rollout restart deployment/employee-service-qa