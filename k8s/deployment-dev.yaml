apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service-dev
  labels:
    app: employee-service-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service-dev
  template:
    metadata:
      labels:
        app: employee-service-dev
    spec:
      containers:
        - name: employee-service
          image: employee-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://host.docker.internal:5432/employeeManagement"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service-dev
spec:
  type: NodePort
  selector:
    app: employee-service-dev
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081